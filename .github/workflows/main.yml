name: Build
on: [push, pull_request]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Restore NuGet packages
        run: nuget restore AiHelper.sln
      - name: Build
        run: msbuild AiHelper.sln /p:Configuration=Release
      - name: Package build outputs
        shell: powershell
        run: |
          Get-ChildItem -Recurse -Path . -Include *.dll,*.exe,*.pdb | Where-Object { $_.FullName -notmatch 'obj|bin\\obj|packages' } | ForEach-Object { $_.FullName } | Select-Object -First 50
          Compress-Archive -Path AiHelper.sln,ShareRibbon/bin/Release/*,ExcelAi/bin/Release/*,WordAi/bin/Release/*,PowerPointAi/bin/Release/* -DestinationPath build-output.zip -Force
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: OfficeAgent-Build
          path: build-output.zip
