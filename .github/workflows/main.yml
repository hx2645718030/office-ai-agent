name: Build
on: [push, pull_request]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Restore NuGet packages
        run: nuget restore AiHelper.sln
      - name: Build
        run: msbuild AiHelper.sln /p:Configuration=Release
      - name: Find MSI
        run: dir /s /b *.msi
      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: OfficeAgent
          path: |
            **/OfficeAgent.msi
            **/Release/**/*.msi
            **/Release/**/**/*.msi
